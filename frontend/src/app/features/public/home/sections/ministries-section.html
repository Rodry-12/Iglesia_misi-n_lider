<section class="ministerios--section" aria-labelledby="ministries-heading">
  <div class="ministerios--title"><h2 id="ministries-heading">Ministerios</h2></div>
  <div class="ministerios-container">
    <button
      type="button"
      aria-label="Ministerios anteriores"
      class="ministerios-prev"
      (click)="move(-1)"
    >
      <i class="fa fa-angle-double-left" aria-hidden="true"></i>
    </button>
    <div #rail class="ministerios-container-list" (scroll)="updatePosition()">
      @for (ministry of ministries; track ministry.id) {
        <article class="ministerio-card">
          <figure class="ministerio-card--image">
            <img [src]="ministry.image" [alt]="ministry.title" loading="lazy" />
          </figure>
          <details class="ministerio-card--content">
            <summary>
              <span class="ministerio-card--label"
                ><i class="fa fa-angle-double-up" aria-hidden="true"></i
              ></span>
              <h3>
                <span>{{ ministry.prefix }}</span> {{ ministry.label }}
              </h3>
            </summary>
            <div class="ministerio-card--description">
              <p>{{ ministry.description }}</p>
            </div>
          </details>
        </article>
      }
    </div>
    <button
      type="button"
      aria-label="Siguientes ministerios"
      class="ministerios-next"
      (click)="move(1)"
    >
      <i class="fa fa-angle-double-right" aria-hidden="true"></i>
    </button>
    <div class="ministerios-indicators" aria-label="Seleccionar ministerio">
      @for (ministry of ministries; track ministry.id; let index = $index) {
        <button
          type="button"
          class="glider-dot"
          [class.active]="current() === index"
          [attr.aria-label]="ministry.title"
          (click)="select(index)"
        ></button>
      }
    </div>
  </div>
</section>
