name: Backend verification

on:
  push:
    paths: ["backend/**", "scripts/check-specs.mjs", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "scripts/check-specs.mjs", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mlp_backend_tests
          POSTGRES_USER: backend_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U backend_test -d mlp_backend_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      MLP_TEST_DATABASE: Host=localhost;Port=5432;Database=mlp_backend_tests;Username=backend_test;Password=isolated-ci-password;SSL Mode=Disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node ../scripts/check-specs.mjs
      - run: dotnet restore MisionLiderParis.slnx --locked-mode
      - run: dotnet build MisionLiderParis.slnx --no-restore -c Release
      - name: Restore inspected structure only into the isolated CI database
        env:
          PGPASSWORD: isolated-ci-password
        run: psql -h localhost -U backend_test -d mlp_backend_tests -v ON_ERROR_STOP=1 -f docs/reference/live-ministry-baseline.sql.txt
      - run: dotnet test MisionLiderParis.slnx --no-build --no-restore -c Release --logger trx --results-directory artifacts/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/artifacts/test-results
