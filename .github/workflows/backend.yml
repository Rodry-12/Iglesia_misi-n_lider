name: Backend verification

on:
  push:
    paths:
      [
        "backend/**",
        "scripts/check-specs.mjs",
        "scripts/spec-workflow.test.mjs",
        ".github/workflows/backend.yml",
      ]
  pull_request:
    paths:
      [
        "backend/**",
        "scripts/check-specs.mjs",
        "scripts/spec-workflow.test.mjs",
        ".github/workflows/backend.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test ../scripts/spec-workflow.test.mjs
      - run: node ../scripts/check-specs.mjs
      - run: dotnet restore MisionLiderParis.slnx --locked-mode
      - run: dotnet build MisionLiderParis.slnx --no-restore -c Release
      - name: Run unit tests without PostgreSQL
        # TEMPORARY: review reference SQL integrity and restore SchemaComparisonTests before production.
        run: dotnet test tests/MisionLiderParis.UnitTests/MisionLiderParis.UnitTests.csproj --no-build --no-restore -c Release --filter "FullyQualifiedName!~SchemaComparisonTests" --logger trx --results-directory artifacts/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/artifacts/test-results
